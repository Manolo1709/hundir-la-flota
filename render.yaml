# Despliegue en Render (gratis, sin tarjeta)
# https://render.com/deploy  →  "Connect a repository" con este repo
services:
  - type: web
    name: hundir-la-flota-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # URL pública: así el botón "Invitar jugadores" genera enlaces absolutos
      - key: PUBLIC_URL
        value: https://hundir-la-flota-online.onrender.com
