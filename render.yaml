# Despliegue en Render (gratis, sin tarjeta)
# https://render.com/deploy  →  "Connect a repository" con este repo
services:
  - type: web
    name: hundir-la-flota
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
